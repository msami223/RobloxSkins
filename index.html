<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roblox Skin Lab</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <div id="app">
    <!-- 1. Left Sidebar (Navigation) -->
    <nav class="sidebar-nav">
      <div class="nav-item active" data-tab="upload">
        <i class="fa-solid fa-cloud-arrow-up"></i>
        <span>Uploads</span>
      </div>
      <div class="nav-item" data-tab="draw">
        <i class="fa-solid fa-paintbrush"></i>
        <span>Draw</span>
      </div>
      <div class="nav-item" data-tab="layers">
        <i class="fa-solid fa-layer-group"></i>
        <span>Layers</span>
      </div>
      <div class="spacer"></div>
      <div class="nav-item" id="nav-reset">
        <i class="fa-solid fa-rotate-right"></i>
        <span>Reset</span>
      </div>
      <div class="nav-item" id="nav-download">
        <i class="fa-solid fa-download"></i>
        <span>Export</span>
      </div>
    </nav>

    <!-- 2. Secondary Panel (Contextual Tools) -->
    <aside class="side-panel">

      <!-- Uploads Panel -->
      <div class="panel-content active" id="panel-upload">
        <h2>Uploads</h2>

        <div class="upload-group" style="display: flex; flex-direction: column; gap: 10px;">
          <label class="upload-btn">
            <i class="fa-solid fa-shirt"></i> Upload to Shirt
            <input type="file" id="img-upload-shirt" accept="image/*" hidden>
          </label>

          <label class="upload-btn">
            <i class="fa-solid fa-socks"></i> Upload to Pants
            <input type="file" id="img-upload-pants" accept="image/*" hidden>
          </label>
        </div>

        <p class="hint">Upload PNGs or logos.</p>
      </div>

      <!-- Drawing Panel -->
      <div class="panel-content" id="panel-draw">
        <h2>Drawing Tools</h2>
        <div class="tool-group">
          <label>Color</label>
          <div class="color-picker-wrapper">
            <input type="color" id="color-picker" value="#ff0000">
            <span id="color-hex">#FF0000</span>
          </div>
        </div>
        <div class="tool-group">
          <label>Brush Size: <span id="size-val">5</span>px</label>
          <input type="range" id="brush-size" min="1" max="50" value="5">
        </div>
        <div class="tool-group">
          <button id="btn-brush" class="btn-tool active"><i class="fa-solid fa-pencil"></i> Brush</button>
          <button id="btn-eraser" class="btn-tool"><i class="fa-solid fa-eraser"></i> Eraser</button>
        </div>
      </div>

      <!-- Layers Panel -->
      <div class="panel-content" id="panel-layers">
        <h2>Layers</h2>
        <p class="hint">Objects on Canvas</p>
        <div class="layer-list">
          <!-- Populated by JS -->
        </div>
      </div>

    </aside>

    <!-- 3. Main Workspace (Canvas Area) -->
    <main class="workspace">
      <!-- Flex Container for Canvases -->
      <div class="canvas-container-wrapper" id="workspace-wrapper"
        style="display: flex; flex-direction: column; gap: 20px; align-items: flex-start; width: 100%; overflow-y: auto; padding: 20px;">
        <!-- Fabric will inject .canvas-container divs here around our canvas elements -->
        <canvas id="editor-canvas" width="585" height="559"></canvas>
        <!-- Second canvas is created in JS and appended here -->
      </div>


    </main>

    <!-- 4. 3D Preview Panel (Floating or Fixed Right) -->
    <aside class="preview-panel">
      <div id="scene-container"></div>
      <div class="model-switcher">
        <button class="switch-btn" data-model="roblox_model_blocky.glb">Blocky</button>
        <button class="switch-btn active" data-model="model-boy.glb">Boy</button>
        <button class="switch-btn" data-model="model-girl.glb">Girl</button>
      </div>
    </aside>

  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
